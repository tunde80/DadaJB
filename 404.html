<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Lost — Dr. Dada Joseph Babatunde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .err { min-height: 80vh; display: grid; place-content: center; text-align: center; gap: 1.2rem; }
    .err .code { font-family: var(--mono); color: var(--copper); letter-spacing: 0.2em; text-transform: uppercase; font-size: var(--step--1); }
    .err h1 { font-family: var(--display); font-size: var(--step-4); font-weight: 700; letter-spacing: -0.02em; }
    .err p { color: var(--ink-soft); max-width: 40ch; margin-inline: auto; }
  </style>
</head>
<body>
  <main class="wrap err">
    <p class="code">Error 404 — No Signal</p>
    <h1>This trace leads nowhere.</h1>
    <p>The page you're looking for isn't on the board. Let's get you back to a working circuit.</p>
    <p><a class="btn btn-primary" href="/">Return home</a></p>
  </main>
</body>
</html>
